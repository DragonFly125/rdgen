name: update docker image

# PUSHTRIGGER 2026-09-30. Dieser Ablauf stammt vom urspruenglichen Autor
# und kann in dieser Abspaltung nur scheitern: er meldet sich bei Docker Hub
# mit Zugangsdaten an, die hier nicht hinterlegt sind (GitHub reicht
# Geheimnisse nie an eine Abspaltung weiter -- es ist eine Anmeldung mit
# LEEREN Feldern, kein Zugriff auf fremde Zugangsdaten).
# Am 2026-09-19 hat genau das beim SOFORTREFRESH-Push eine Fehlermail an
# den Betreiber ausgeloest, fuer etwas, das er nicht angestossen hat und
# das ihn nichts angeht. Der eigentliche Schaden ist nicht die eine Mail,
# sondern das Abstumpfen: wer drei nutzlose Meldungen bekommt, liest die
# vierte nicht mehr -- und die waere die echte gewesen.
# Deshalb laeuft er nur noch auf ausdruecklichen Zuruf, nicht mehr von
# selbst bei jedem Push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: set docker image tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "IMAGE_TAG=dev" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          else
            echo "CREATE_IMAGE=false" >> "$GITHUB_ENV"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: env.CREATE_IMAGE == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: env.CREATE_IMAGE == 'true'

      - name: Build and push
        uses: docker/build-push-action@v6
        if: env.CREATE_IMAGE == 'true'
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}
